name: LMR

options:
  bundleIdPrefix: com.eduardtavalbi
  deploymentTarget:
    iOS: "17.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  CoreXLSX:
    url: https://github.com/CoreOffice/CoreXLSX.git
    from: 0.14.1

targets:
  LMR:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
    dependencies:
      - package: GRDB
        product: GRDB
      - package: CoreXLSX
        product: CoreXLSX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eduardtavalbi.lmr
        INFOPLIST_KEY_CFBundleDisplayName: L.M.R.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: L.M.R. uses the microphone so you can record and replay your pronunciation.
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

  LMRTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LMR
      - package: GRDB
        product: GRDB
      - package: CoreXLSX
        product: CoreXLSX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eduardtavalbi.lmr.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  LMR:
    build:
      targets:
        LMR: all
        LMRTests: [test]
    test:
      targets:
        - LMRTests
